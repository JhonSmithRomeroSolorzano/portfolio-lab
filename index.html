<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ec" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script id="theme-bootstrap">
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("portfolio-theme");
        } catch {}
        const theme =
          preference === "light" || preference === "dark"
            ? preference
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('link[rel="icon"]')
          .setAttribute(
            "href",
            theme === "dark" ? "./favicon-dark.svg" : "./favicon.svg",
          );
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#0e1b2d" : "#f4f3ec");
      })();
    </script>
    <meta
      name="description"
      content="Jhon Smith Romero — full-stack developer working with JavaScript, TypeScript, React and Node.js. Explore my engineering portfolio and interactive systems lab."
    />
    <title>Jhon Smith Romero — Full-stack developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
