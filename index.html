<!doctype html>

    <meta charset="UTF-8" />

    <link
      rel="preload"
      href="./fonts/ibm-plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#f4f3ec" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script id="theme-bootstrap">
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("portfolio-theme");
        } catch {}
        const theme =
          preference === "light" || preference === "dark"
            ? preference
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('link[rel="icon"]')
          .setAttribute(
            "href",
            theme === "dark" ? "./favicon-dark.svg" : "./favicon.svg",
          );
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#0e1b2d" : "#f4f3ec");
      })();
    </script>
